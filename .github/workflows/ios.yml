name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project HiddenJams.xcodeproj \
            -scheme HiddenJams \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          devs = [x for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x.get('isAvailable')]
          print(devs[0]['name'] if devs else '')
          ")
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project HiddenJams.xcodeproj \
            -scheme HiddenJams \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:HiddenJamsTests \
            CODE_SIGNING_ALLOWED=NO
