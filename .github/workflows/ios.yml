name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        # Pinned: Xcode 27.2 (iOS 27.2 SDK). Build 91 was built with Xcode 26.3
        # and crashed on launch for App Review on iOS 27.2.1 (LAU-6).
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer && xcodebuild -version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project HiddenJams.xcodeproj \
            -scheme HiddenJams \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          devs = [x for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x.get('isAvailable')]
          print(devs[0]['name'] if devs else '')
          ")
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project HiddenJams.xcodeproj \
            -scheme HiddenJams \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:HiddenJamsTests \
            CODE_SIGNING_ALLOWED=NO
